<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objectives PoC</title>
<style>
@font-face { font-family: "Headline"; src: url("../../src/fonts/Headline.woff2") format("woff2"); }
@font-face { font-family: "EventFont"; src: url("../../src/fonts/EventFont.woff2") format("woff2"); }

:root { --pale: #fffef0; --mid: #fff3a6; --outline: #e6d778; --corner: #fff25a; --corner-glow: rgba(255,242,90,.7); --corner-edge: #8a7a2c; --hue: hue-rotate(0deg); --screen-grad: linear-gradient(180deg, var(--pale) 0%, var(--mid) 78%, var(--pale) 100%); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0b0d0c; height: 100%; }
body { overflow: auto; }

#viewport { width: calc(1830px * var(--s, 1)); height: calc(var(--H, 662) * 1px * var(--s, 1)); margin: 40px auto; }
#stage { position: relative; width: 1830px; height: calc(var(--H, 662) * 1px); transform: scale(var(--s, 1)); transform-origin: 0 0; font-family: "EventFont", Georgia, serif; }
#layer { position: absolute; inset: 0; z-index: 1; }
.abs { position: absolute; }
#space { inset: 0; background:
  radial-gradient(circle at 20% 15%, #fff 0 1px, transparent 1.5px) 0 0 / 190px 230px,
  radial-gradient(circle at 70% 60%, #cfd 0 1px, transparent 1.5px) 0 0 / 260px 310px,
  radial-gradient(ellipse at 50% 40%, #1d1a22, #0a0a0c 80%); }

/* text card: the title-banner style (gradient, outline, ink splatters) */
/* same as the resource banners: floating outline with a transparent gap, corner brackets, drop shadow */
.card { background: var(--screen-grad); outline: 2px solid var(--outline); outline-offset: 4px; box-shadow: inset 0 0 0 2px var(--outline), 0 5px 8px rgba(0,0,0,.5); }
.corners { /* reinforced L-brackets on the four card corners */
  --c: var(--corner); --l: 12px; --t: 12px; /* covers the 5px outer rings (3px dark + 2px gold) */
  position: absolute; inset: -6px; pointer-events: none; opacity: .4;
  background:
    linear-gradient(var(--c), var(--c)) 0 0 / var(--l) var(--t),
    linear-gradient(var(--c), var(--c)) 0 0 / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) 100% 0 / var(--l) var(--t),
    linear-gradient(var(--c), var(--c)) 100% 0 / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) 0 100% / var(--l) var(--t),
    linear-gradient(var(--c), var(--c)) 0 100% / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) 100% 100% / var(--l) var(--t),
    linear-gradient(var(--c), var(--c)) 100% 100% / var(--t) var(--l);
  background-repeat: no-repeat;
  filter: drop-shadow(0 0 1px var(--corner-edge)) drop-shadow(0 0 4px var(--corner-glow)); /* slight glow */
}
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--splat) -173px -61px / 600px 300px; opacity: .5; }
.txt { position: absolute; inset: 0; display: flex; align-items: center; padding: 6px 20px 6px 46px; font-size: 29px; line-height: 1.08; color: #1c1c1c; }
.txt b { font-weight: 700; letter-spacing: .5px; }
.txt i { font-style: italic; }

/* picture frame: chamfered rectangle with an acute (87°) pointed tip; the body is as tall as the text card plus 4px on each side (176); body 230 x 184 = 2.5:2, as tall as the text card with its 8px outline on each side; border = 1/15 of the body height (12.3px); the pointed tips stick out 13px above and below top and bottom centre (box 205 x 202; the tips of neighbouring rows touch) */
.pic { filter: drop-shadow(0 5px 6px rgba(0,0,0,.6)); --outer: polygon(12px 13px, 103px 13px, 115px 0, 127px 13px, 218px 13px, 230px 25px, 230px 185px, 218px 197px, 127px 197px, 115px 210px, 103px 197px, 12px 197px, 0 185px, 0 25px);
  --inner: polygon(19.3px 25.3px, 106px 25.3px, 115px 15.8px, 124px 25.3px, 210.7px 25.3px, 217.7px 32.3px, 217.7px 177.7px, 210.7px 184.7px, 124px 184.7px, 115px 194.2px, 106px 184.7px, 19.3px 184.7px, 12.3px 177.7px, 12.3px 32.3px);
  --ring: path(evenodd, "M12 13 L103 13 L115 0 L127 13 L218 13 L230 25 L230 185 L218 197 L127 197 L115 210 L103 197 L12 197 L0 185 L0 25 Z M19.3 25.3 L106 25.3 L115 15.8 L124 25.3 L210.7 25.3 L217.7 32.3 L217.7 177.7 L210.7 184.7 L124 184.7 L115 194.2 L106 184.7 L19.3 184.7 L12.3 177.7 L12.3 32.3 Z"); }
.pic .in { position: absolute; inset: 0; clip-path: var(--outer); background: #20202a var(--img) center / cover no-repeat; } /* cover = auto crop; the picture runs under the border */
.pic .rw { position: absolute; inset: 0; filter: drop-shadow(0 0 7px rgba(0,0,0,.75)); } /* the border casts a shadow onto the picture */
.pic .o { position: absolute; inset: 0; clip-path: var(--ring); background: linear-gradient(180deg, color-mix(in srgb, var(--outline) 55%, #fff), var(--outline) 60%, color-mix(in srgb, var(--outline) 80%, #000)); }

/* connector: metal cage cropped from CL-torch, mirrored for the right side, light bar between */
.cage { background: url("../../src/images/base/CL-torch.png") no-repeat; background-size: auto 100%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.6)); }
.cage.l { background-position: 100% 0; }
.cage.r { background-position: 100% 0; transform: scaleX(-1); }
.light { background: url("../../src/images/base/light.png") 0 0 / 100% 100% no-repeat; filter: var(--hue); }
.light.h { background: none; }
.light.h > i { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; background: url("../../src/images/base/light.png") 0 0 / 100% 100% no-repeat; }

#ctl { position: fixed; top: 10px; right: 10px; z-index: 99999; font: 13px/1.3 system-ui, sans-serif; color: #e8e8e0; }
#ctl > button { display: block; margin-left: auto; padding: 6px 10px; border: 1px solid #55523f; border-radius: 6px; background: #1d1c14; color: #f3e48a; cursor: pointer; font: inherit; }
#ctl .box { margin-top: 6px; width: 340px; max-height: calc(100vh - 70px); overflow: auto; padding: 12px; border: 1px solid #55523f; border-radius: 8px; background: rgba(20,19,14,.94); box-shadow: 0 6px 18px rgba(0,0,0,.5); }
#ctl.closed .box { display: none; }
#ctl h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #f3e48a; }
#ctl h4.sub { margin-top: 14px; }
#ctl label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
#ctl input[type=text], #ctl input[type=number], #ctl textarea { padding: 4px 6px; border: 1px solid #55523f; border-radius: 4px; background: #0d0c08; color: #fff; font: inherit; }
#ctl textarea { width: 100%; height: 64px; resize: vertical; margin-top: 4px; }
#ctl input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid #55523f; border-radius: 4px; background: #0d0c08; cursor: pointer; }
#ctl .tc { display: flex; gap: 6px; align-items: center; }
#ctl #thex { width: 86px; font: 12px ui-monospace, monospace; }
#ctl .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#ctl .row button, #ctl .ln button { padding: 5px 8px; border: 1px solid #55523f; border-radius: 4px; background: #2a281c; color: #e8e8e0; cursor: pointer; font: inherit; }
#ctl .row button { flex: 1 1 auto; }
#ctl .sw { flex: 1 1 0; min-width: 0; height: 24px; padding: 0 !important; border: 2px solid #55523f !important; }
#ctl .ln { margin: 8px 0; padding: 8px 0 0; border-top: 1px solid #3a372a; }
#ctl .ln .l1 { display: flex; gap: 4px; align-items: center; }
#ctl .ln .l1 input[type=text] { flex: 1; min-width: 0; }
#ctl .ln input[type=file] { width: 100%; margin-top: 4px; font: 11px system-ui; color: #a9a58a; }
#ctl .info { margin-top: 8px; color: #a9a58a; font-size: 12px; }
</style>
</head>
<body>
<div id="ctl">
  <button id="ctlToggle" type="button">Controls</button>
  <div class="box">
    <h4>Theme</h4>
    <label>Primary colour <span class="tc"><input id="tcol" type="color"><input id="thex" type="text" maxlength="7" spellcheck="false"></span></label>
    <div class="row" id="tpre"></div>
    <h4 class="sub">Size</h4>
    <label>Width (px) <input id="cw" type="number" min="100" max="6000" step="10" style="width:92px"></label>
    <label>Scale (%) <input id="cs" type="number" min="5" max="500" step="5" style="width:92px"></label>
    <div class="row"><button type="button" data-fit="screen">Fit screen</button><button type="button" data-fit="orig">1830 px</button></div>
    <div class="info" id="cinfo"></div>
    <h4 class="sub">Cards</h4>
    <div class="info">Left column first, then right. Without a file the card shows a drawn cat; every image is auto-cropped to the window.</div>
    <div id="lines"></div>
    <div class="row"><button type="button" id="resetCards">Reset</button></div>
  </div>
</div>
<div id="viewport"><div id="stage">
  <div id="space" class="abs"></div>
  <div id="layer"></div>
</div></div>

<script>
const BASE_W = 1830, BASE_H = 684;
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const layer = $("layer");

const defaultCards = () => [
  { title: "Strategically Important World:", text: "The unique natural resources of this world have to be acquired for the Greater Good." },
  { title: "Aun'va:", text: "Let there be no doubt that the Tau empire will bring unity to all species. Let there be no doubt that our time has come." },
  { title: "Tau'va:", text: "No expansion without equilibrium. No conquest without control. Pursue the success of this balance in service of the Tau'va." },
  { title: "Reconquista:", text: "We previously gained control over this world through patience and good will. Now it's time to take it back through force!" },
  { title: "Rescue Mission:", text: "There are no more arguments to be traded with them. We have to save our ambassadors." },
  { title: "Support Our Allies:", text: "Although this world is not home to us, it's the home of our allies. We have to liberate the world for the Greater Good." },
];
let cards = defaultCards();
try { const sv = JSON.parse(localStorage.getItem("objectivesCards") || "null"); if (Array.isArray(sv) && sv.length === 6) cards = sv; } catch (e) {}
const images = [];                       // uploaded data URLs, kept in memory only (too big for localStorage)
/* placeholder art: a drawn cat per card (SVG, cropped to the window by background-size: cover) */
function cat(n) {
  const fur = ["#e9a24a", "#9aa3ad", "#2b2b33", "#f1e4cf", "#c9783a", "#6f6a62"][n % 6], dark = ["#b8742a", "#6c747e", "#101015", "#c9b69a", "#8f4f20", "#4a463f"][n % 6];
  const sky = [["#f4b8c9", "#7fa7d9"], ["#9ed1f2", "#f7e3a6"], ["#f6c177", "#7a5aa6"], ["#a8e0c2", "#4f8fb5"], ["#f2a1a1", "#ffd9a0"], ["#b9a7f0", "#f2b8d0"]][n % 6];
  const eye = n % 3 === 2 ? "#ffd34a" : "#6bd06f";
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 240' preserveAspectRatio='xMidYMid slice'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${sky[0]}'/><stop offset='1' stop-color='${sky[1]}'/></linearGradient></defs>
    <rect width='300' height='240' fill='url(#g)'/>
    <ellipse cx='150' cy='250' rx='170' ry='60' fill='#5d7a3a' opacity='.8'/>
    <path d='M80 240 Q86 170 150 165 Q214 170 220 240 Z' fill='${fur}'/>
    <path d='M92 100 L102 40 L140 78 Z M208 100 L198 40 L160 78 Z' fill='${fur}'/>
    <path d='M104 88 L108 56 L132 80 Z M196 88 L192 56 L168 80 Z' fill='#f2a7b3'/>
    <ellipse cx='150' cy='125' rx='66' ry='56' fill='${fur}'/>
    <path d='M150 70 L146 92 M150 70 L154 92 M130 76 L134 90 M170 76 L166 90' stroke='${dark}' stroke-width='4' stroke-linecap='round'/>
    <ellipse cx='126' cy='118' rx='13' ry='15' fill='${eye}'/><ellipse cx='174' cy='118' rx='13' ry='15' fill='${eye}'/>
    <ellipse cx='126' cy='118' rx='4.5' ry='12' fill='#111'/><ellipse cx='174' cy='118' rx='4.5' ry='12' fill='#111'/>
    <circle cx='121' cy='111' r='3.5' fill='#fff'/><circle cx='169' cy='111' r='3.5' fill='#fff'/>
    <path d='M143 138 L157 138 L150 147 Z' fill='#f2a7b3'/>
    <path d='M150 147 Q150 158 138 158 M150 147 Q150 158 162 158' stroke='#222' stroke-width='3' fill='none' stroke-linecap='round'/>
    <path d='M108 142 L66 134 M108 150 L64 156 M192 142 L234 134 M192 150 L236 156' stroke='#fff' stroke-width='2.5' stroke-linecap='round' opacity='.9'/>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const catArt = Array.from({ length: 6 }, (_, n) => cat(n));
const save = () => { try { localStorage.setItem("objectivesCards", JSON.stringify(cards)); } catch (e) {} };

const el = (cls, css, html = "", parent = layer) => {
  const d = document.createElement("div");
  d.className = "abs " + cls;
  Object.assign(d.style, Object.fromEntries(Object.entries(css).map(([k, v]) => [k, typeof v === "number" ? v + "px" : v])));
  d.innerHTML = html; parent.appendChild(d); return d;
};
function lightH(x1, y, x2, t, parent) {
  const L = x2 - x1, d = el("light h", { left: x1, top: y - t / 2, width: L, height: t }, "", parent), i = document.createElement("i");
  Object.assign(i.style, { width: t + "px", height: L + "px", transform: `translate(0, ${t}px) rotate(-90deg)` });
  const nat = 518 * t / 33; if (L < nat) i.style.backgroundSize = `${t}px ${nat}px`; // crop, never squash
  d.appendChild(i);
}
function splatTile() {
  const W = 600, H = 300, r = (a, b) => a + Math.random() * (b - a), out = [];
  const drop = (x, y, rad) => out.push(`<ellipse cx='${x.toFixed(1)}' cy='${y.toFixed(1)}' rx='${(rad * r(.8, 1.25)).toFixed(2)}' ry='${(rad * r(.8, 1.25)).toFixed(2)}' transform='rotate(${Math.floor(r(0, 180))} ${x.toFixed(1)} ${y.toFixed(1)})'/>`);
  for (let i = 0; i < 34; i++) {
    const x = r(0, W), y = r(0, H), rad = [1.6, 2, 2.4, 2.9, 3.4][Math.floor(r(0, 5))], ang = r(0, 2 * Math.PI);
    drop(x, y, rad);
    for (let k = Math.floor(r(3, 10)); k--;) { // spray of tiny satellites flung one way
      const d = r(rad * 2.2, rad * 9), a = ang + (Math.random() + Math.random() + Math.random() - 1.5) * .7;
      drop(x + Math.cos(a) * d, y + Math.sin(a) * d, r(.35, 1.1) * Math.max(.5, rad / 2.2));
    }
  }
  for (let i = 0; i < 160; i++) drop(r(0, W), r(0, H), r(.4, 1)); // fine specks
  return `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'><g fill='%23463a26'>${out.join("")}</g></svg>")`;
}
const splats = new Map();

/* ---------- layout: 2 columns x 3 rows, reference pixels ---------- */
const COLS = [{ x: 62, pic: 62 }, { x: 1045, pic: 1045 }];
const ROW_TOP = [44, 254, 464], ROW_H = 168, PIC_W = 230, TXT_X = 210, TXT_W = 535; // the picture frame overlaps the first 20px of the text card
function render() {
  layer.innerHTML = "";
  document.documentElement.style.setProperty("--H", BASE_H);
  cards.forEach((c, n) => {
    const col = COLS[n < 3 ? 0 : 1], top = ROW_TOP[n % 3];
    const txt = el("card", { left: col.x + TXT_X, top, width: TXT_W, height: ROW_H }, `<div class="txt"><div><b>${esc(c.title)}</b> <i>${esc(c.text)}</i></div></div>`);
    txt.dataset.k = n;
    txt.insertAdjacentHTML("beforeend", '<div class="corners"></div>');
    const pic = el("pic", { left: col.pic + PIC_W * 0.02, top: top - 21, width: PIC_W, height: 210 } /* shifted right by 2% of its width */, `<div class="in"><div class="rw"><div class="o"></div></div></div>`);
    pic.style.setProperty("--img", `url("${images[n] || catArt[n]}")`); // uploaded image, or the drawn cat
  });
  layer.querySelectorAll("[data-k]").forEach(e => { let s = splats.get(e.dataset.k); if (!s) splats.set(e.dataset.k, s = splatTile()); e.style.setProperty("--splat", s); });
  applySize();
}

/* ---------- size ---------- */
let sc = Math.min(1, (innerWidth - 40) / BASE_W);
try { const v = +localStorage.getItem("objectivesScale"); if (v > 0) sc = v; } catch (e) {}
function applySize(from) {
  sc = Math.min(6, Math.max(.05, sc || 1));
  document.documentElement.style.setProperty("--s", sc);
  if (from !== "w") $("cw").value = Math.round(BASE_W * sc);
  if (from !== "s") $("cs").value = Math.round(sc * 100);
  $("cinfo").textContent = `${Math.round(BASE_W * sc)} × ${Math.round(BASE_H * sc)} px · design ${BASE_W} × ${BASE_H}`;
  try { localStorage.setItem("objectivesScale", sc); } catch (e) {}
}
$("cw").addEventListener("input", e => { sc = +e.target.value / BASE_W; applySize("w"); });
$("cs").addEventListener("input", e => { sc = (+e.target.value || 100) / 100; applySize("s"); });
document.querySelectorAll("#ctl [data-fit]").forEach(b => b.addEventListener("click", () => { sc = b.dataset.fit === "screen" ? Math.min((innerWidth - 40) / BASE_W, (innerHeight - 100) / BASE_H) : 1; applySize(); }));
$("ctlToggle").addEventListener("click", () => $("ctl").classList.toggle("closed"));

/* ---------- theme ---------- */
const THEMES = { Gold: "#f3df5e", Green: "#62d06f", Red: "#e8625c", Blue: "#62a4ec", Purple: "#ac7ee6", Orange: "#f29d3e", Teal: "#4fcdc3" };
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60; }
  return [h, s * 100, l * 100];
}
function applyTheme(hex, from) {
  const [h, s] = hexToHsl(hex), root = document.documentElement.style, clamp = v => Math.round(Math.min(100, Math.max(0, v)));
  root.setProperty("--mid", `hsl(${Math.round(h)} ${clamp(s + 14)}% 83%)`);
  root.setProperty("--pale", `hsl(${Math.round(h)} ${clamp(s * .55 + 22)}% 96%)`);
  root.setProperty("--outline", `hsl(${Math.round(h)} ${clamp(s * .8)}% 69%)`);
  root.setProperty("--corner", `hsl(${Math.round(h)} ${clamp(s + 14)}% 67%)`);
  root.setProperty("--corner-glow", `hsl(${Math.round(h)} ${clamp(s + 14)}% 67% / .7)`);
  root.setProperty("--corner-edge", `hsl(${Math.round(h)} ${clamp(s * .6)}% 32%)`);
  root.setProperty("--hue", `hue-rotate(${(h - 52).toFixed(1)}deg)`);
  if (from !== "col") $("tcol").value = hex;
  if (from !== "hex") $("thex").value = hex;
  try { localStorage.setItem("objectivesTheme", hex); } catch (e) {}
}
$("tpre").innerHTML = Object.entries(THEMES).map(([n, c]) => `<button type="button" class="sw" data-c="${c}" title="${n}" style="background:${c}"></button>`).join("");
$("tpre").addEventListener("click", e => { if (e.target.dataset.c) applyTheme(e.target.dataset.c); });
$("tcol").addEventListener("input", e => applyTheme(e.target.value, "col"));
$("thex").addEventListener("input", e => { let v = e.target.value.trim(); if (v[0] !== "#") v = "#" + v; if (/^#[0-9a-f]{6}$/i.test(v)) applyTheme(v.toLowerCase(), "hex"); });
let th = THEMES.Gold;
try { const v = localStorage.getItem("objectivesTheme"); if (/^#[0-9a-f]{6}$/i.test(v || "")) th = v; } catch (e) {}
applyTheme(th);

/* ---------- cards editor ---------- */
function buildList() {
  $("lines").innerHTML = cards.map((c, i) => `<div class="ln" data-i="${i}">
    <div class="l1"><span class="info" style="margin:0;width:44px">${i < 3 ? "L" : "R"}${i % 3 + 1}</span><input type="text" data-f="title" value="${esc(c.title)}"></div>
    <textarea data-f="text">${esc(c.text)}</textarea>
    <input type="file" accept="image/*" data-img="1">
  </div>`).join("");
}
$("lines").addEventListener("input", e => { const f = e.target.dataset.f; if (!f) return; cards[+e.target.closest(".ln").dataset.i][f] = e.target.value; save(); render(); });
$("lines").addEventListener("change", e => {
  if (!e.target.dataset.img || !e.target.files[0]) return;
  const i = +e.target.closest(".ln").dataset.i, fr = new FileReader();
  fr.onload = () => { images[i] = fr.result; render(); };
  fr.readAsDataURL(e.target.files[0]);
});
$("resetCards").addEventListener("click", () => { cards = defaultCards(); images.length = 0; save(); buildList(); render(); });

buildList();
render();
</script>
</body>
</html>
