<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Table PoC</title>
<style>
@font-face { font-family: "Headline"; src: url("../../src/fonts/Headline.woff2") format("woff2"); }

:root {
  --parch: #f3df5e;      /* primary colour: everything below is derived from it by the theme script */
  --mid: #fff3a6; --outline: #e6d778; --corner: #fff25a; --corner-glow: rgba(255,242,90,.7);
  --corner-edge: #8a7a2c; --fill-shadow: rgba(120,90,10,.55); --hue: hue-rotate(0deg);
  --parch-dark: #e6d98a;
  --edge: #cfc27a;
  --green: #18bf48;
  --blue: #1b2a6b;
  --red: #7d1414;
  --orange: #d9601a;
  --yellow: #e9d83a;
  --yellow-dark: #8d8420;
  --screen-grad: linear-gradient(180deg, #ffffff 0%, var(--mid) 78%, #ffffff 100%); /* white edges, yellow peak shifted down to 78% */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0b0d0c; height: 100%; }
body { overflow: auto; }

/* Fixed design canvas 1290 x 2000 (coordinates match the reference); the whole stage is scaled to the size picked in the control panel */
#layer { position: absolute; inset: 0; z-index: 1; }
#viewport { width: calc(1290px * var(--sx, 1)); height: calc(var(--H, 2000) * 1px * var(--sy, 1)); margin: 0 auto; }
#stage {
  position: relative; width: 1290px; height: calc(var(--H, 2000) * 1px); overflow: hidden;
  transform: scale(var(--sx, 1), var(--sy, 1)); transform-origin: 0 0;
  font-family: "Headline", "Impact", sans-serif;
}
.abs { position: absolute; }


/* ---------- canvas size controls (outside the scaled stage) ---------- */
#ctl { position: fixed; top: 10px; right: 10px; z-index: 99999; font: 13px/1.3 system-ui, sans-serif; color: #e8e8e0; }
#ctl > button { display: block; margin-left: auto; padding: 6px 10px; border: 1px solid #55523f; border-radius: 6px; background: #1d1c14; color: #f3e48a; cursor: pointer; font: inherit; }
#ctl .box { margin-top: 6px; width: 330px; max-height: calc(100vh - 70px); overflow: auto; padding: 12px; border: 1px solid #55523f; border-radius: 8px; background: rgba(20,19,14,.94); box-shadow: 0 6px 18px rgba(0,0,0,.5); }
#ctl.closed .box { display: none; }
#ctl h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #f3e48a; }
#ctl label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
#ctl input[type=number] { width: 92px; padding: 4px 6px; border: 1px solid #55523f; border-radius: 4px; background: #0d0c08; color: #fff; font: inherit; }
#ctl .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#ctl .row button { flex: 1 1 auto; padding: 5px 8px; border: 1px solid #55523f; border-radius: 4px; background: #2a281c; color: #e8e8e0; cursor: pointer; font: inherit; }
#ctl .row button:hover { background: #3a372a; }
#ctl h4.sub { margin-top: 14px; }
#ctl .ln { margin: 8px 0; padding: 8px 0 0; border-top: 1px solid #3a372a; }
#ctl .ln .l1 { display: flex; gap: 4px; }
#ctl .ln .l2 { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 5px; align-items: center; }
#ctl .ln input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid #55523f; border-radius: 4px; background: #0d0c08; color: #fff; font: inherit; }
#ctl .ln input[type=number] { width: 44px; padding: 3px 4px; }
#ctl .ln label { margin: 0; gap: 3px; font-size: 11px; color: #a9a58a; }
#ctl .ln button { padding: 2px 7px; border: 1px solid #55523f; border-radius: 4px; background: #2a281c; color: #e8e8e0; cursor: pointer; font: inherit; }
#ctl .ln button:disabled { opacity: .3; cursor: default; }
#ctl .tc { display: flex; gap: 6px; align-items: center; }
#ctl input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid #55523f; border-radius: 4px; background: #0d0c08; cursor: pointer; }
#ctl #thex { width: 86px; padding: 4px 6px; border: 1px solid #55523f; border-radius: 4px; background: #0d0c08; color: #fff; font: 12px ui-monospace, monospace; }
#ctl .sw { flex: 1 1 0; min-width: 0; height: 24px; padding: 0; border: 2px solid #55523f; border-radius: 4px; cursor: pointer; }
#ctl .sw:hover { border-color: #fff; }
#ctl .info { margin-top: 8px; color: #a9a58a; font-size: 12px; }

/* ---------- Frame ---------- */
#stone { display: none;
  left: 0; top: 80px; width: 1212px; height: 1920px;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .22  0 0 0 .35 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"),
    linear-gradient(90deg, #a49b86, #c7bfab 40%, #bdb49e);
  box-shadow: inset 0 0 40px rgba(0,0,0,.35);
}
#rightStrip {
  left: 1212px; top: 100px; width: 50px; height: 1900px;
  background: linear-gradient(90deg, #1c211f, #2d3330 50%, #181c1a);
  border-left: 3px solid #0a0c0b;
}
#plate {
  left: 155px; top: 98px; width: 1008px; height: 1865px;
  background: linear-gradient(145deg, #55523f, #39362a 50%, #4a4736);
}
#plate::after { /* second thin inner border */
  content: ""; position: absolute; inset: 14px; background: #17131c;
}
#space {
  left: 185px; top: 128px; width: 948px; height: 1805px;
  background:
    radial-gradient(circle at 20% 15%, #fff 0 1px, transparent 1.5px) 0 0 / 190px 230px,
    radial-gradient(circle at 70% 60%, #cfd 0 1px, transparent 1.5px) 0 0 / 260px 310px,
    radial-gradient(ellipse at 50% 40%, #241d30, #0f0b14 75%);
}
.rivet {
  width: 34px; height: 34px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #d8d2c0, #8b8571 55%, #4a4639);
  box-shadow: 0 2px 3px rgba(0,0,0,.6);
}
.spike {
  width: 34px; height: 85px;
  background: linear-gradient(90deg, #17160f, #77715a 45%, #1d1c14);
  clip-path: polygon(50% 0, 78% 70%, 100% 100%, 0 100%, 22% 70%);
}
.spike::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 0; height: 22px; background: #3a382b; }
.sidespike {
  width: 55px; height: 26px; background: linear-gradient(180deg, #55513f, #15140d);
  clip-path: polygon(0 50%, 100% 0, 100% 100%);
}

/* ---------- Connectors (yellow striped bars) ---------- */
.bars { height: 44px; z-index: -5; } /* lowest layer: behind the screen frame (-4), pipes (-3), torch (-2) and every card */
.bars.tall { height: 46px; }
/* every light stripe is ../../src/images/base/light.png (vertical art); horizontal ones turn it a quarter */
.light { background: url("../../src/images/base/light.png") 0 0 / 100% 100% no-repeat; filter: var(--hue); } /* no glow; hue follows the theme */
.light.h { background: none; }
.light.h > i { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; background: url("../../src/images/base/light.png") 0 0 / 100% 100% no-repeat; }
.socket { /* CL-torch joint: spike points left, cage faces the unit circle */
  width: 200px; height: 69px; /* native 2129:738 */
  background: url("../../src/images/base/CL-torch.png") center / 100% 100% no-repeat;
  filter: drop-shadow(0 4px 3px rgba(0,0,0,.6));
  z-index: -2; /* above the horizontal pipes and light bars (-3); vertical pipes are above it */
}
.joint { /* L / T pipe junctions: white centre with an exponential falloff; box 160x120, junction centre at (30,60) */
  --v: linear-gradient(90deg, rgba(255,255,255,0), #fff 50%, rgba(255,255,255,0));  /* vertical arm cross-fade */
  width: 160px; height: 120px;
  background: var(--v) var(--vp) / var(--vs) no-repeat; /* vertical glow */
  -webkit-mask-image: radial-gradient(circle 75px at 30px 60px, rgba(0,0,0,1) 0%, rgba(0,0,0,0.74) 10%, rgba(0,0,0,0.55) 20%, rgba(0,0,0,0.41) 30%, rgba(0,0,0,0.3) 40%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.165) 60%, rgba(0,0,0,0.12) 70%, rgba(0,0,0,0.09) 80%, rgba(0,0,0,0.06) 90%, rgba(0,0,0,0) 100%);
          mask-image: radial-gradient(circle 75px at 30px 60px, rgba(0,0,0,1) 0%, rgba(0,0,0,0.74) 10%, rgba(0,0,0,0.55) 20%, rgba(0,0,0,0.41) 30%, rgba(0,0,0,0.3) 40%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.165) 60%, rgba(0,0,0,0.12) 70%, rgba(0,0,0,0.09) 80%, rgba(0,0,0,0.06) 90%, rgba(0,0,0,0) 100%);
}
.joint::before { /* corner patch: clipped to the L/T outline, same exponential falloff; drawn over the pipe and the stub to hide the seam */
  content: ""; position: absolute; inset: 0; clip-path: var(--clip);
  background: radial-gradient(circle 55px at 30px 60px, rgba(255,255,255,1) 0%, rgba(255,255,255,0.74) 10%, rgba(255,255,255,0.55) 20%, rgba(255,255,255,0.41) 30%, rgba(255,255,255,0.3) 40%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.165) 60%, rgba(255,255,255,0.12) 70%, rgba(255,255,255,0.09) 80%, rgba(255,255,255,0.06) 90%, rgba(255,255,255,0) 100%);
}
.joint.L-dr { --vp: 22px 52px; --vs: 16px 68px; --clip: path("M30 52 H70 V68 H38 V84 H22 V60 Q22 52 30 52 Z"); } /* down + right */
.joint.L-ur { --vp: 22px 0;    --vs: 16px 68px; --clip: path("M22 36 H38 V52 H70 V68 H30 Q22 68 22 60 Z"); } /* up + right */
.joint.T    { --vp: 22px 0;    --vs: 16px 120px; --clip: path("M22 36 H38 V52 H70 V68 H38 V84 H22 Z"); } /* only the crossing, soft */
.joint.T::before, .joint.L-dr::before, .joint.L-ur::before { background: radial-gradient(circle 26px at 30px 60px, rgba(255,255,255,.55) 0%, rgba(255,255,255,.3) 40%, rgba(255,255,255,0) 100%); } /* up + down + right */
.stub { /* branch from the corner to the torch cage ring: same 16px thickness as the pipe, flat end, fading to black into the ring */
  height: 16px; border-radius: 0 8px 8px 0; /* round end, stops short of the cage ring */
  background: linear-gradient(180deg, #d4c43c 0%, #fff7a0 28%, #fff 50%, #fff29a 76%, #d4c43c 100%);
}
.stub.T, .stub.L-dr, .stub.L-ur { /* branch drawn from the same light.png art as the pipe; lighten = union of both tubes, no seam */
  background: none; overflow: hidden; mix-blend-mode: lighten; border-radius: 0 8px 8px 0;
}
.stub.L-dr { border-radius: 8px 8px 8px 0; } /* rounded outer corner of the L */
.stub.L-ur { border-radius: 0 8px 8px 8px; }
.stub::after { display: none; } /* bar stays fully opaque all the way to its round end */
.pipe { border-radius: 5px; box-shadow: 0 0 7px 2px rgba(255,245,170,.55), 0 0 0 1px #1c1a10; }
.pipe.h { background: linear-gradient(180deg, #8a8468 0, #fffdf0 30%, #fff 50%, #d9d2a8 75%, #7a745a 100%); }
.pipe.v { background: linear-gradient(90deg, #8a8468 0, #fffdf0 30%, #fff 50%, #d9d2a8 75%, #7a745a 100%); }

/* ---------- Level badge ---------- */
.badge { width: 100px; height: 140px; }
.badge .bg {
  position: absolute; left: 0; top: 19px; width: 100px; height: 102px; background: url("../../src/images/base/level.png") center / 100% 100% no-repeat; /* native 208:213 */
  filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 0 #000);
}
.badge .banner { /* CL-banner plate (1024x1536, 2:3) the badge sits on */
  position: absolute; left: -10px; top: -20px; width: 120px; height: 180px;
  background: url("../../src/images/base/CL-banner.png") center / 100% 100% no-repeat;
  filter: drop-shadow(0 4px 4px rgba(0,0,0,.6));
}
.badge span {
  position: absolute; left: 0; right: 0; top: 30px; text-align: center;
  font-size: 50px; line-height: 1; color: #2b2410;
}

/* ---------- Unit circle ---------- */
.circle { width: 192px; height: 192px; }
.circle::before { /* dark shadow behind the ring, above the light bars (-5), below pipes/torch */
  content: ""; position: absolute; inset: 14px; border-radius: 50%; z-index: -4; pointer-events: none;
  box-shadow: 0 0 22px 14px rgba(0,0,0,.8);
}
.circle .fill {
  position: absolute; left: 21px; top: 21px; right: 21px; bottom: 21px; border-radius: 50%;
  background: var(--parch);
  box-shadow: inset 0 0 14px var(--fill-shadow);
}
.circle .ring { position: absolute; inset: -4px; background: url("../../src/images/base/unit-border.png") center / 100% 100% no-repeat; }
.circle .mini {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 8px 6px rgba(0,0,0,.75)) drop-shadow(0 16px 14px rgba(0,0,0,.5));
}

/* ---------- Parchment cards ---------- */
.card {
  background: var(--parch);
  /* tiny gold line floating 4px off the rectangle, transparent gap in between */
  outline: 4px solid var(--outline); outline-offset: 4px; /* 4px = 50% of the 8px corner brackets */
  box-shadow: 0 5px 8px rgba(0,0,0,.5);
}
.card::before, .circle .fill::before { /* softened paper texture */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: url("../../src/images/base/texture.png") 0 0 / 187px 187px; /* 280 / 1.5 */
  /* crisp stripes: black parts keep the yellow base, white parts turn white */
  mix-blend-mode: screen; opacity: .75;
  filter: brightness(.571) contrast(5); /* stretch the grey texture to clear black/white stripes; "screen" then gives yellow + white */
}
.card::after { /* fine grain noise */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .1  0 0 0 .9 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  mix-blend-mode: multiply; opacity: .18;
}
.corners { /* reinforced L-brackets on the four card corners */
  --c: var(--corner); --l: 24px; --t: 8px; /* covers the 5px outer rings (3px dark + 2px gold) */
  position: absolute; inset: -8px; pointer-events: none; opacity: .7;
  background:
    linear-gradient(var(--c), var(--c)) 0 0 / var(--l) var(--t),
    linear-gradient(var(--c), var(--c)) 0 0 / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) 100% 0 / var(--l) var(--t),
    linear-gradient(var(--c), var(--c)) 100% 0 / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) 0 100% / var(--l) var(--t),
    linear-gradient(var(--c), var(--c)) 0 100% / var(--t) var(--l),
    linear-gradient(var(--c), var(--c)) 100% 100% / var(--l) var(--t),
    linear-gradient(var(--c), var(--c)) 100% 100% / var(--t) var(--l);
  background-repeat: no-repeat;
  filter: drop-shadow(0 0 1px var(--corner-edge)) drop-shadow(0 0 4px var(--corner-glow)); /* slight glow */
}
.card.tab { /* no border: soft glow instead */
  border: 0; outline: 0;
  background: var(--screen-grad); /* same gradient as the stats screen */
  /* thin light-yellow outline drawn outside the bar */
  box-shadow: 0 0 0 5px var(--outline); /* 5px outline = half the 10px squares; same colour as the outer border of the gear and stats rectangles */
}
.card.tab::after { /* same tiny ink splatters as the stats screens, tile shifted so the pattern differs */
  background: var(--splat) -173px -61px / 600px 300px;
  mix-blend-mode: normal; opacity: .5;
}
.card.tab::before { /* 10px white squares (6px gap) centred on the left and right edges: 5px on the outline, 5px on the bar */
  display: block; inset: -5px -5px 0; border-radius: 0; mix-blend-mode: normal; filter: none; opacity: 1; /* box starts at the outline's outer top corner */
  --v: repeating-linear-gradient(180deg, #fff 0 10px, transparent 10px 16px);
  background:
    var(--v) 0 0 / 10px 100% no-repeat,       /* first square is centred on the corner */
    var(--v) 100% 0 / 10px 100% no-repeat;
}
.card.screen { /* bright, backlit screen */
  border: 0; outline: 0;
  background: var(--screen-grad);
}
.card.screen::before { display: none; } /* stats screens: no paper texture */
.card.screen::after { /* tiny dark ink splatters, a different random tile per element (--splat is set in JS) */
  background: var(--splat) 0 0 / 600px 300px;
  mix-blend-mode: normal; opacity: .5;
}
.screenFrame { /* floating gold line + shadow of the stats screen */
  outline: 4px solid var(--outline); outline-offset: 4px; /* 4px = 50% of the 8px corner brackets */
  /* normal stacking: after the title tab in the DOM, so its rings draw over the tab */
  box-shadow: 0 5px 8px rgba(0,0,0,.5);
}
.shade { /* wide dark shadow on its own layer: above the light bars (-5), below every tab and card, so it never darkens a title bar */
  position: absolute; inset: 0; z-index: -4; pointer-events: none;
  box-shadow: 0 0 16px 8px rgba(0,0,0,.75);
}
.halo { /* soft glow around the rings */
  position: absolute; inset: -8px; pointer-events: none; /* the ring edge itself: no second line, glow only */
  display: none; /* no glow */
}
.tab { /* title plate above the card */ }
.tab .t {
  position: absolute; left: 0; right: 0; top: 0; text-align: center;
  font-size: 35px; letter-spacing: .5px; color: #1c1c1c; text-transform: uppercase;
  white-space: nowrap; transform: scaleX(.95);
}

.cost {
  position: absolute; font-size: 66px; color: var(--green); line-height: 1;
}
.gear { width: 92px; height: 92px; filter: hue-rotate(12deg) saturate(1.25) brightness(1.02) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff); background: url("../../src/images/base/gear.png") center / contain no-repeat; }
.icon { background: center / contain no-repeat; }
.num {
  position: absolute; text-align: center; line-height: 1; font-size: 58px;
  width: 80px; margin-left: -40px;
}
.num.white { color: #fff; }
.num.orange { color: var(--orange); }

#forgeLabel { position: absolute; }
.forgeSlot { height: 50px; width: 104px; }
.card.tab.forgeSlot { box-shadow: 0 0 0 5px var(--outline); } /* 5px outline = half the 10px squares; same colour as the outer border of the gear and stats rectangles */
.card.tab.forgeSlot::before { /* 10px white squares (6px gap) centred on the left and right edges: 5px on the outline, 5px on the slot */
  display: block; inset: -5px; border-radius: 0; mix-blend-mode: normal; filter: none; opacity: 1;
  --v: repeating-linear-gradient(180deg, #fff 0 10px, transparent 10px 16px);
  background:
    var(--v) 0 0 / 10px 100% no-repeat,
    var(--v) 100% 0 / 10px 100% no-repeat;
}
.forgeSlot .icon { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96px; height: 46px; filter: hue-rotate(-5deg) saturate(1.8) brightness(.95); }
</style>
</head>
<body>
<div id="ctl">
  <button id="ctlToggle" type="button">Canvas size</button>
  <div class="box">
    <h4>Canvas size</h4>
    <label>Width (px) <input id="cw" type="number" min="100" max="8000" step="10"></label>
    <label>Height (px) <input id="ch" type="number" min="100" max="12000" step="10"></label>
    <label>Scale (%) <input id="cs" type="number" min="5" max="500" step="5"></label>
    <label><span>Keep proportions</span> <input id="lock" type="checkbox" checked></label>
    <div class="row">
      <button type="button" data-fit="width">Fit width</button>
      <button type="button" data-fit="screen">Fit screen</button>
      <button type="button" data-fit="orig">1290 × 2000</button>
      <button type="button" data-fit="x2">2×</button>
    </div>
    <div class="info" id="cinfo"></div>
    <h4 class="sub">Theme</h4>
    <label>Primary colour <span class="tc"><input id="tcol" type="color"><input id="thex" type="text" maxlength="7" spellcheck="false"></span></label>
    <div class="row" id="tpre"></div>
    <div class="info">Panels, title bars, outlines, corner brackets and light bars are recalculated from it. Level banners stay yellow.</div>
    <h4 class="sub">Lines</h4>
    <div class="info">City / Factory and Bastion are always present. Rows with the same level share one pipe and banner.</div>
    <div id="lines"></div>
    <div class="row">
      <button type="button" id="addLine">Add line</button>
      <button type="button" id="addLevel">Add line + new level</button>
      <button type="button" id="resetLines">Reset</button>
    </div>
  </div>
</div>
<div id="viewport"><div id="stage">
  <div id="stone" class="abs"></div>
  <div id="rightStrip" class="abs"></div>
  <div id="plate" class="abs"></div>
  <div id="space" class="abs"></div>
  <div id="layer"></div>
</div></div>

<script>
/* ---------- constants (reference px, design width 1290) ---------- */
const BASE_W = 1290;
const CITY_TOP = 185, UNIT_TOP = 408, STEP = 222, FORGE_EXTRA = 25, CARD_H = 122;
const PX = 109, PIPE_T = 16;        // pipe / banner centre x, pipe thickness
const IMG = "../../src/images/base/";
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const layer = $("layer");

/* ---------- data: unit lines (City/Factory is custom and always drawn; Bastion is a fixed first line) ---------- */
let nextId = 1;
const mk = o => ({ id: nextId++, name: "New unit", cost: 2, power: 2, health: 2, morale: 2, forge: false, level: 0, ...o });
const defaultRows = () => { nextId = 1; return [
  mk({ name: "Bastion", img: "bastion", cost: 2, power: 2, health: 3, morale: 2, level: 0, fixed: true }),
  mk({ name: "Guardsmen",                  cost: 2, power: 1, health: 1, morale: 2, level: 0 }),
  mk({ name: "Lunar-Class Cruisers",       cost: 2, power: 2, health: 2, morale: 2, level: 0 }),
  mk({ name: "Ogryns",                     cost: 3, power: 2, health: 4, morale: 2, level: 1 }),
  mk({ name: "Leman Russ Battle Tanks",    cost: 4, power: 3, health: 4, morale: 3, level: 2 }),
  mk({ name: "Emperor-Class Battleships",  cost: 5, power: 4, health: 6, morale: 3, level: 2, forge: true }),
  mk({ name: "Warhound Titans",            cost: 5, power: 3, health: 5, morale: 4, level: 3, forge: true }),
]; };
let rows = null;
try {
  const saved = JSON.parse(localStorage.getItem("unitTableRows") || "null");
  if (Array.isArray(saved) && saved.length && saved[0].fixed) { rows = saved; nextId = Math.max(...rows.map(r => r.id)) + 1; }
} catch (e) {}
rows = rows || defaultRows();
const saveRows = () => { try { localStorage.setItem("unitTableRows", JSON.stringify(rows)); } catch (e) {} };

/* ---------- element helpers ---------- */
const el = (cls, css, html = "", parent = layer) => {
  const d = document.createElement("div");
  d.className = "abs " + cls;
  Object.assign(d.style, Object.fromEntries(Object.entries(css).map(([k, v]) => [k, typeof v === "number" ? v + "px" : v])));
  d.innerHTML = html; parent.appendChild(d);
  if (/\bcard\b/.test(cls) && !/\b(tab|forgeSlot)\b/.test(cls)) d.insertAdjacentHTML("beforeend", '<div class="corners"></div>');
  if (/\bscreenFrame\b/.test(cls) || (/\bcard\b/.test(cls) && !/\bscreen\b/.test(cls))) d.insertAdjacentHTML("beforeend", '<div class="shade"></div>');
  if (/\bscreenFrame\b/.test(cls) || (/\bcard\b/.test(cls) && !/\b(tab|forgeSlot|screen)\b/.test(cls))) d.insertAdjacentHTML("beforeend", '<div class="halo"></div>');
  return d;
};
const keyed = (d, k) => { d.dataset.k = k; return d; };

// light stripe from (x1,y1) to (x2,y2), t thick, axis-aligned, drawn from light.png
function light(x1, y1, x2, y2, t, parent = layer) {
  if (y1 === y2) { // horizontal: the vertical art turned a quarter
    const L = x2 - x1, d = el("light h", { left: x1, top: y1 - t / 2, width: L, height: t }, "", parent);
    const i = document.createElement("i");
    Object.assign(i.style, { width: t + "px", height: L + "px", transform: `translate(0, ${t}px) rotate(-90deg)` });
    d.appendChild(i);
  } else el("light", { left: x1 - t / 2, top: y1, width: t, height: y2 - y1 }, "", parent);
}
function tab(x, y, w, h, text, key) {
  const t = el("card tab", { left: x, top: y, width: w, height: h + 6, borderBottom: "none" });
  t.innerHTML = `<div class="t" style="top:${h - 40}px">${esc(text)}</div>`;
  return keyed(t, key);
}
function circle(cx, cy, row) {
  const c = el("circle", { left: cx - 96, top: cy - 96 });
  c.innerHTML = `<div class="fill"></div>`;
  if (row.img) {
    const w = { city: 92, bastion: 80, factory: 90 }[row.img] || 90;
    c.innerHTML += `<img class="mini" src="${IMG}${row.img}.png" style="width:${w}px;">`;
  } // lines without an image show an empty circle
  c.innerHTML += `<div class="ring"></div>`;
}
function forgeSlot(top, key) {
  const f = el("card tab forgeSlot", { left: 489, top: top + 124, width: 104, height: 50 });
  f.innerHTML = `<div class="icon" style="background-image:url(${IMG}forge.png)"></div>`;
  keyed(f, key);
}

/* ---------- random ink splatters: every screen and title bar keeps its own tile ---------- */
function splatTile() {
  const W = 600, H = 300, r = (a, b) => a + Math.random() * (b - a), out = [];
  const drop = (x, y, rad) => out.push(`<ellipse cx='${x.toFixed(1)}' cy='${y.toFixed(1)}' rx='${(rad * r(.8, 1.25)).toFixed(2)}' ry='${(rad * r(.8, 1.25)).toFixed(2)}' transform='rotate(${Math.floor(r(0, 180))} ${x.toFixed(1)} ${y.toFixed(1)})'/>`);
  for (let i = 0; i < 34; i++) {
    const x = r(0, W), y = r(0, H), rad = [1.6, 2, 2.4, 2.9, 3.4][Math.floor(r(0, 5))], ang = r(0, 2 * Math.PI);
    drop(x, y, rad);
    for (let k = Math.floor(r(3, 10)); k--;) { // spray of tiny satellites flung one way
      const d = r(rad * 2.2, rad * 9), a = ang + (Math.random() + Math.random() + Math.random() - 1.5) * .7;
      drop(x + Math.cos(a) * d, y + Math.sin(a) * d, r(.35, 1.1) * Math.max(.5, rad / 2.2));
    }
  }
  for (let i = 0; i < 160; i++) drop(r(0, W), r(0, H), r(.4, 1)); // fine specks
  return `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'><g fill='%23463a26'>${out.join("")}</g></svg>")`;
}
const splats = new Map();

/* ---------- render: redraws every line, join and level banner from `rows` ---------- */
let baseH = 2000;
function render() {
  layer.innerHTML = "";

  // 1. vertical layout: each line sits STEP below the previous one; a forge slot pushes the next line down
  const tops = [];
  rows.forEach((r, i) => tops.push(i === 0 ? UNIT_TOP : tops[i - 1] + STEP + (rows[i - 1].forge ? FORGE_EXTRA : 0)));
  const last = rows.length - 1;
  baseH = Math.round(tops[last] + (rows[last].forge ? 174 : CARD_H) + 62);
  document.documentElement.style.setProperty("--H", baseH);
  $("plate").style.height = baseH - 135 + "px";
  $("space").style.height = baseH - 195 + "px";
  $("rightStrip").style.height = baseH - 100 + "px";

  // 2. items on the left rail: the City/Factory line first (custom), then every unit line
  const items = [{ cy: CITY_TOP + 61, level: rows[0].level }, ...rows.map((r, i) => ({ cy: tops[i] + 61, level: r.level }))];

  // 3. level groups = consecutive items with the same level
  const groups = [];
  items.forEach((it, i) => {
    const g = groups[groups.length - 1];
    if (g && g.level === it.level) g.idx.push(i); else groups.push({ level: it.level, idx: [i] });
  });

  // 4. pipes and joins: a group with several items gets one pipe, an L at each end and a T for every middle item
  groups.forEach(g => {
    if (g.idx.length < 2) return;
    const a = items[g.idx[0]].cy, b = items[g.idx[g.idx.length - 1]].cy;
    light(PX, a + 3.6, PX, b + 3.6, PIPE_T); // pipe ends at the stub centre so the rounded corners stay clean
    g.idx.forEach((idx, n) => {
      const k = n === 0 ? "L-dr" : n === g.idx.length - 1 ? "L-ur" : "T", cy = items[idx].cy;
      const w = k === "T" ? 139 - PX : 147 - PX, st = el("stub " + k, { left: k === "T" ? PX : PX - 8, top: cy - 4.4, width: w });
      light(0, 8, w, 8, 16, st);
      el("joint " + k, { left: PX - 30, top: cy - 56.4 });
    });
  });

  // 5. torch + three cage light bars for every item
  items.forEach(it => {
    el("socket", { left: 42, top: it.cy - 34 });
    const bars = el("bars", { left: 150, top: it.cy - 22, width: 980 });
    [6.5, 21.5, 35.5].forEach(o => light(0, o + 6, 980, o + 6, 12, bars)); // centres measured on the torch cage openings
  });

  // 6. level banners: anchored to the torch slots of their group
  groups.forEach(g => {
    // centred by torch slot, not by pixels: on the middle torch of an odd group, midway between the middle pair of an even one.
    // Forge slots only change the gaps between rows, so they never relocate the banner relative to its torch.
    const n = g.idx.length, c = items[g.idx[n >> 1]].cy;
    const y = (n % 2 ? c : (items[g.idx[(n >> 1) - 1]].cy + c) / 2) + 5;
    el("badge", { left: PX - 50, top: y - 70, width: 100, height: 140 }, `<div class="banner"></div><div class="bg"></div><span>${esc(g.level)}</span>`);
  });

  // 7. City / Factory line (custom, always present)
  tab(470, CITY_TOP - 43, 138, 44, "City", "c-t");
  el("card", { left: 457, top: CITY_TOP, width: 168, height: 122 });
  el("cost", { left: 472, top: CITY_TOP + 37 }, 3);
  el("gear", { left: 512, top: CITY_TOP + 12 });
  circle(335, CITY_TOP + 61, { img: "city" });
  circle(818, CITY_TOP + 61, { img: "factory" });
  tab(945, CITY_TOP - 43, 140, 44, "Factory", "f-t");
  el("card", { left: 930, top: CITY_TOP, width: 168, height: 125 });
  el("cost", { left: 945, top: 222 }, 2);
  el("gear", { left: 985, top: 197 });

  // 8. unit lines (Bastion goes through exactly the same code)
  rows.forEach((r, i) => {
    const top = tops[i], cy = top + 61;
    tab(500, top - 43, 556, 44, r.name, r.id + "t");
    circle(335, cy, r);
    el("card", { left: 457, top, width: 168, height: 122 });
    el("cost", { left: 472, top: top + 38 }, esc(r.cost));
    el("gear", { left: 512, top: top + 14 });
    if (r.forge) forgeSlot(top, r.id + "f");
    // stats screen in two layers: frame (border + rings) sits under the light bars, the fill sits over them
    el("screenFrame", { left: 655, top, width: 443, height: 122 });
    keyed(el("card screen", { left: 655, top, width: 443, height: 122 }), r.id + "s");
    el("icon", { left: 678, top: top + 10, width: 102, height: 108, backgroundImage: `url(${IMG}power.png)` });
    el("icon", { left: 820, top: top + 8, width: 100, height: 106, backgroundImage: `url(${IMG}health.png)` });
    el("icon", { left: 962, top: top + 78, width: 98, height: 38, backgroundImage: `url(${IMG}morale.png)` });
    el("num white", { left: 728, top: top + 22 }, esc(r.power));
    el("num white", { left: 870, top: top + 22 }, esc(r.health));
    el("num orange", { left: 1010, top: top + 22 }, esc(r.morale));
  });

  // 9. splatter tiles (cached per element so editing a line does not reshuffle the others)
  layer.querySelectorAll("[data-k]").forEach(e => {
    let t = splats.get(e.dataset.k);
    if (!t) splats.set(e.dataset.k, t = splatTile());
    e.style.setProperty("--splat", t);
  });
  applySize();
}

/* ---------- canvas size: everything scales with the stage ---------- */
const size = { sx: Math.min(1, innerWidth / BASE_W), sy: 0, lock: true };
size.sy = size.sx;
try { Object.assign(size, JSON.parse(localStorage.getItem("unitTableScale") || "{}")); } catch (e) {}
function applySize(from) {
  size.sx = Math.min(6, Math.max(.05, size.sx || 1));
  size.sy = Math.min(6, Math.max(.05, size.sy || 1));
  const root = document.documentElement.style, w = Math.round(BASE_W * size.sx), h = Math.round(baseH * size.sy);
  root.setProperty("--sx", size.sx);
  root.setProperty("--sy", size.sy);
  if (from !== "w") $("cw").value = w;
  if (from !== "h") $("ch").value = h;
  if (from !== "s") $("cs").value = Math.round(size.sx * 100);
  $("lock").checked = size.lock;
  $("cinfo").textContent = `${w} × ${h} px · x${size.sx.toFixed(2)} / y${size.sy.toFixed(2)} · design ${BASE_W} × ${baseH}` + (Math.abs(size.sx - size.sy) > .005 ? " (stretched)" : "");
  try { localStorage.setItem("unitTableScale", JSON.stringify(size)); } catch (e) {}
}
$("cw").addEventListener("input", e => { size.sx = +e.target.value / BASE_W; if (size.lock) size.sy = size.sx; applySize("w"); });
$("ch").addEventListener("input", e => { size.sy = +e.target.value / baseH; if (size.lock) size.sx = size.sy; applySize("h"); });
$("cs").addEventListener("input", e => { size.sx = size.sy = (+e.target.value || 100) / 100; applySize("s"); });
$("lock").addEventListener("change", e => { size.lock = e.target.checked; if (size.lock) { size.sy = size.sx; applySize(); } });
document.querySelectorAll("#ctl [data-fit]").forEach(b => b.addEventListener("click", () => {
  const f = b.dataset.fit, kw = (innerWidth - 20) / BASE_W, kh = (innerHeight - 20) / baseH;
  size.lock = true; size.sx = size.sy = f === "width" ? kw : f === "screen" ? Math.min(kw, kh) : f === "x2" ? 2 : 1; applySize();
}));
$("ctlToggle").addEventListener("click", () => $("ctl").classList.toggle("closed"));

/* ---------- lines editor ---------- */
function buildList() {
  $("lines").innerHTML = rows.map((r, i) => `<div class="ln" data-i="${i}">
    <div class="l1">
      <input type="text" data-f="name" value="${esc(r.name)}">
      <button type="button" data-a="up" title="Move up" ${i < 2 ? "disabled" : ""}>▲</button>
      <button type="button" data-a="dn" title="Move down" ${i === 0 || i === rows.length - 1 ? "disabled" : ""}>▼</button>
      <button type="button" data-a="rm" title="${r.fixed ? "Bastion is always present" : "Remove line"}" ${r.fixed ? "disabled" : ""}>✕</button>
    </div>
    <div class="l2">
      ${[["cost", "Cost"], ["power", "Pow"], ["health", "HP"], ["morale", "Mor"], ["level", "Level"]].map(([f, t]) => `<label>${t}<input type="number" data-f="${f}" value="${r[f]}" ${f === "level" ? "" : 'min="0"'}></label>`).join("")}
      <label><input type="checkbox" data-f="forge" ${r.forge ? "checked" : ""}>Forge</label>
    </div>
  </div>`).join("");
}
function refresh(rebuild) { saveRows(); if (rebuild) buildList(); render(); }
$("lines").addEventListener("input", e => {
  const f = e.target.dataset.f, i = +e.target.closest(".ln").dataset.i;
  rows[i][f] = f === "name" ? e.target.value : f === "forge" ? e.target.checked : (e.target.value === "" ? 0 : +e.target.value);
  refresh(false);
});
$("lines").addEventListener("click", e => {
  const a = e.target.dataset.a; if (!a) return;
  const i = +e.target.closest(".ln").dataset.i;
  if (a === "rm" && !rows[i].fixed) rows.splice(i, 1);
  if (a === "up" && i >= 2) [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]];
  if (a === "dn" && i >= 1 && i < rows.length - 1) [rows[i + 1], rows[i]] = [rows[i], rows[i + 1]];
  refresh(true);
});
$("addLine").addEventListener("click", () => { rows.push(mk({ level: rows[rows.length - 1].level })); refresh(true); });
$("addLevel").addEventListener("click", () => { rows.push(mk({ level: rows[rows.length - 1].level + 1 })); refresh(true); });
$("resetLines").addEventListener("click", () => { rows = defaultRows(); refresh(true); });

/* ---------- theme: one primary colour, everything else derived from it ---------- */
const THEMES = { Gold: "#f3df5e", Green: "#62d06f", Red: "#e8625c", Blue: "#62a4ec", Purple: "#ac7ee6", Orange: "#f29d3e", Teal: "#4fcdc3" };
function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60; }
  return [h, s * 100, l * 100];
}
function applyTheme(hex, from) {
  const [h, s] = hexToHsl(hex), root = document.documentElement.style, clamp = v => Math.round(Math.min(100, Math.max(0, v)));
  const hs = (sat, light, a) => `hsl(${Math.round(h)} ${clamp(sat)}% ${light}%${a != null ? ` / ${a}` : ""})`;
  root.setProperty("--parch", hex);                          // card / circle base
  root.setProperty("--mid", hs(s + 14, 83));                 // peak of the screen / banner gradient
  root.setProperty("--outline", hs(s * .8, 69));             // outer borders
  root.setProperty("--corner", hs(s + 14, 67));              // corner brackets
  root.setProperty("--corner-glow", hs(s + 14, 67, .7));
  root.setProperty("--corner-edge", hs(s * .6, 32));
  root.setProperty("--fill-shadow", hs(Math.max(s, 50), 24, .55));
  root.setProperty("--hue", `hue-rotate(${(h - 52).toFixed(1)}deg)`); // yellow light bars follow the hue; level banners keep their yellow
  if (from !== "col") $("tcol").value = hex;
  if (from !== "hex") $("thex").value = hex;
  try { localStorage.setItem("unitTableTheme", hex); } catch (e) {}
}
$("tpre").innerHTML = Object.entries(THEMES).map(([n, c]) => `<button type="button" class="sw" data-c="${c}" title="${n}" style="background:${c}"></button>`).join("");
$("tpre").addEventListener("click", e => { if (e.target.dataset.c) applyTheme(e.target.dataset.c); });
$("tcol").addEventListener("input", e => applyTheme(e.target.value, "col"));
$("thex").addEventListener("input", e => { let v = e.target.value.trim(); if (v[0] !== "#") v = "#" + v; if (/^#[0-9a-f]{6}$/i.test(v)) applyTheme(v.toLowerCase(), "hex"); });
let savedTheme = THEMES.Gold;
try { const t = localStorage.getItem("unitTableTheme"); if (/^#[0-9a-f]{6}$/i.test(t || "")) savedTheme = t; } catch (e) {}
applyTheme(savedTheme);

buildList();
render();
</script>
</body>
